
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FADE. · Panel del staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<script>(function(){var t=localStorage.getItem('theme_staff')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --sub:#8A8A8E;
  --line:#E5E5EA; --accent:#007AFF; --accent-soft:#EAF3FF; --danger:#FF3B30; --ok:#34C759;
  --shadow:0 8px 24px rgba(0,0,0,.06);
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --text:#F2F2F2; --sub:#98989D;
  --line:#38383A; --accent:#0A84FF; --accent-soft:#0A2A44; --danger:#FF453A; --ok:#30D158;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;position:sticky;top:0;backdrop-filter:blur(20px);background:color-mix(in srgb, var(--bg) 80%, transparent);z-index:10;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700;letter-spacing:-.02em}
.theme-toggle{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;transition:transform .18s ease}
.theme-toggle:hover{transform:scale(1.08)}
.theme-toggle:active{transform:scale(.9)}
.theme-toggle svg{width:18px;height:18px;position:absolute;color:var(--text);transition:opacity .3s ease,transform .4s ease}
.icon-sun{opacity:1;transform:scale(1) rotate(0)}
.icon-moon{opacity:0;transform:scale(.5) rotate(-90deg)}
:root[data-theme="dark"] .icon-sun{opacity:0;transform:scale(.5) rotate(90deg)}
:root[data-theme="dark"] .icon-moon{opacity:1;transform:scale(1) rotate(0)}
main{max-width:640px;margin:0 auto;padding:28px 20px 60px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;animation:cardIn .45s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
label:first-child{margin-top:0}
input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;outline:none}
button.cta{width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;margin-top:16px;cursor:pointer;transition:transform .15s ease,opacity .2s}
button.cta:hover{transform:scale(1.015)}
button.cta:active{opacity:.7;transform:scale(.97)}
#msg{text-align:center;font-size:14px;margin-top:10px;font-weight:600;display:none}
#msg.err{color:var(--danger);display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.topbar button{background:none;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:13px;transition:transform .15s ease}
.topbar button:hover{transform:scale(1.04)}
.topbar button:active{transform:scale(.95)}
.cita{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cita .fecha{font-weight:700;font-size:15px;color:var(--accent);min-width:100px}
.cita .info{flex:1}
.cita .info b{font-size:15px}
.cita .info .d{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.5}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.cita.done{opacity:.5}
.acciones{display:flex;flex-direction:column;gap:6px}
.acciones button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:6px 10px;border-radius:10px;font-size:12px;cursor:pointer;transition:transform .15s ease}
.acciones button:hover{transform:scale(1.06)}
.acciones button:active{transform:scale(.92)}
.acciones button.danger{color:var(--danger);border-color:var(--danger)}
#vacio{text-align:center;color:var(--sub);padding:30px 0}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .dia{width:78px;font-size:13px;font-weight:600}
.hrow input[type=time]{width:auto;flex:1;padding:8px 10px;font-size:14px}
.hrow.cerrado input{opacity:.35;pointer-events:none}
.abierto-toggle{width:42px;height:25px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:transform .15s ease}
.abierto-toggle:hover{transform:scale(1.06)}
.abierto-toggle:active{transform:scale(.92)}
.abierto-toggle.on{background:var(--ok)}
.abierto-toggle::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.abierto-toggle.on::after{left:19px}
.collapsible-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.chevron{width:18px;height:18px;color:var(--sub);transition:transform .3s ease}
.chevron.open{transform:rotate(180deg)}
.collapsible-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.collapsible-body.open{max-height:600px}
@media (prefers-reduced-motion: reduce){
  .theme-toggle,.card,button.cta,.topbar button,.acciones button,.abierto-toggle,.chevron,.collapsible-body{transition:none!important;animation:none!important}
}

#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
#splash span{font-size:44px;font-weight:800;letter-spacing:-.02em;color:var(--text);animation:splashIn .6s ease}
#splash.hide{opacity:0;pointer-events:none}
@keyframes splashIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){#splash span{animation:none}}
</style>
</head>
<body>
<div id="splash"><span>staff.</span></div>
<header>
  <div class="brand">FADE. <span style="color:var(--sub);font-weight:400;font-size:14px">· staff</span></div>
  <button class="theme-toggle" id="themeSwitch" onclick="toggleTheme()" aria-label="Cambiar tema">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="4.2" y1="4.2" x2="5.9" y2="5.9"/><line x1="18.1" y1="18.1" x2="19.8" y2="19.8"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="19.8" x2="5.9" y2="18.1"/><line x1="18.1" y1="5.9" x2="19.8" y2="4.2"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 14.3a8.5 8.5 0 0 1-11-11 8.5 8.5 0 1 0 11 11z"/></svg>
  </button>
</header>

<main>
  <div class="card" id="loginCard">
    <label>Correo del staff</label>
    <input id="loginEmail" type="email" placeholder="staff@tunegocio.com">
    <label>Contraseña</label>
    <input id="loginPass" type="password" placeholder="••••••••">
    <button class="cta" onclick="login()">Entrar</button>
    <div id="msg"></div>
  </div>

  <div id="dashboard" style="display:none">
    <button id="btnNotif" onclick="activarNotificaciones()" style="width:100%;margin-bottom:14px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:transform .15s ease">🔔 Activar notificaciones en este dispositivo</button>
    <div class="card" id="horarioCard">
      <div class="collapsible-head" onclick="toggleHorario()">
        <b>Horario semanal</b>
        <svg class="chevron" id="horarioChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="collapsible-body" id="horarioBody">
        <div class="collapsible-inner">
          <div id="horarioFilas" style="margin-top:8px"></div>
          <button class="cta" onclick="guardarHorario()">Guardar horario</button>
          <div id="msgHorario" style="text-align:center;font-size:13px;margin-top:8px;font-weight:600"></div>
        </div>
      </div>
    </div>
    <div class="topbar">
      <button onclick="cargarCitas()">↻ Actualizar</button>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
    <div id="lista"></div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://mbmkxeedxbfxgdhrpiol.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_guPyN5b-kVxUFY38mWWI9A_-5hEAYhV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });

const root=document.documentElement, sw=document.getElementById('themeSwitch');
function applyTheme(t){ root.setAttribute('data-theme',t); localStorage.setItem('theme_staff',t); }
function toggleTheme(){ applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); }

/* ====== SPLASH ====== */
setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, 900);

/* ====== NOTIFICACIONES PUSH ====== */
const VAPID_PUBLIC_KEY = "BBZCrmoz3vE5ghjgjadlbfBWpoQqHm63NL_2SffDm-abRoXRKyYkY4U97_Ti6J35uqG-cVhIPDRXcx6bFM4TKWs";

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function activarNotificaciones(){
  const btn=document.getElementById('btnNotif');
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('Este navegador no admite notificaciones. En iPhone: primero añade esta página a la pantalla de inicio (compartir → Añadir a inicio) y ábrela desde ahí.');
    return;
  }
  try{
    const reg=await navigator.serviceWorker.register('sw.js');
    const permiso=await Notification.requestPermission();
    if(permiso!=='granted'){ alert('Tienes que permitir las notificaciones para activarlas.'); return; }
    const sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    const j=sub.toJSON();
    await sb.from('push_subscriptions').upsert({ endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth }, { onConflict:'endpoint' });
    btn.textContent='🔔 Notificaciones activadas en este dispositivo';
    btn.disabled=true;
  }catch(err){
    alert('No se pudieron activar las notificaciones: '+err);
  }
}

async function login(){
  const msg=document.getElementById('msg');
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPass').value
  });
  if(error){ msg.textContent='Correo o contraseña incorrectos.'; msg.className='err'; return; }
  mostrarPanel();
}
function logout(){ sb.auth.signOut(); document.getElementById('dashboard').style.display='none'; document.getElementById('loginCard').style.display='block'; }

function forzarCierreSesion(){
  sb.auth.signOut();
  document.getElementById('dashboard').style.display='none';
  document.getElementById('loginCard').style.display='block';
}
window.addEventListener('pagehide', forzarCierreSesion);
window.addEventListener('pageshow', (e)=>{ if(e.persisted) forzarCierreSesion(); });

async function mostrarPanel(){
  document.getElementById('loginCard').style.display='none';
  document.getElementById('dashboard').style.display='block';
  cargarCitas();
  cargarHorario();
}

const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

async function cargarHorario(){
  const { data } = await sb.from('horario').select('*').order('dia_semana');
  const cont=document.getElementById('horarioFilas'); cont.innerHTML='';
  (data||[]).forEach(h=>{
    const row=document.createElement('div'); row.className='hrow'+(h.abierto?'':' cerrado');
    row.innerHTML=`<span class="dia">${DIAS[h.dia_semana]}</span>
      <div class="abierto-toggle${h.abierto?' on':''}" onclick="this.classList.toggle('on');this.parentElement.classList.toggle('cerrado')"></div>
      <input type="time" value="${h.hora_inicio}" data-dia="${h.dia_semana}">
      <input type="time" value="${h.hora_fin}">`;
    cont.appendChild(row);
  });
}

async function guardarHorario(){
  const msg=document.getElementById('msgHorario'); msg.textContent='Guardando…'; msg.style.color='var(--sub)';
  for(const row of document.querySelectorAll('#horarioFilas .hrow')){
    const inputs=row.querySelectorAll('input');
    await sb.from('horario').update({
      abierto: row.querySelector('.abierto-toggle').classList.contains('on'),
      hora_inicio: inputs[0].value,
      hora_fin: inputs[1].value
    }).eq('dia_semana', Number(inputs[0].dataset.dia));
  }
  msg.textContent='Horario guardado ✓'; msg.style.color='var(--ok)';
  setTimeout(()=>msg.textContent='', 2500);
}

async function cargarCitas(){
  const { data, error } = await sb.from('citas').select('*').order('fecha_cita', { ascending:true });
  const lista=document.getElementById('lista'); lista.innerHTML='';
  if(error || !data || !data.length){ lista.innerHTML='<div id="vacio">No hay citas todavía.</div>'; return; }
  data.forEach(c=>{
    const f=new Date(c.fecha_cita);
    const fin=new Date(f.getTime()+60*60000);
    const fecha=f.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+' · '+f.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'–'+fin.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    const div=document.createElement('div'); div.className='card cita'+(c.completada?' done':'');
    div.innerHTML=`
      <div class="fecha">${fecha}</div>
      <div class="info">
        <b>${c.nombre}</b>
        <div class="d">${c.tipo_corte} · ${c.precio} € · <span class="badge">${c.metodo_pago==='tarjeta'?'Tarjeta':'En el local'}</span>${c.gratis_quincenal?' <span class="badge" style="background:var(--accent-soft);color:var(--accent)">Gratis · quincenal</span>':''}</div>
        ${c.productos?`<div class="d">🛒 ${c.productos}</div>`:''}
        <div class="d">📞 ${c.telefono} · ${c.email}</div>
      </div>
      <div class="acciones">
        <button onclick="marcar('${c.id}', ${!c.completada})">${c.completada?'Reabrir':'Hecha'}</button>
        <button class="danger" onclick="eliminar('${c.id}')">Eliminar</button>
      </div>`;
    lista.appendChild(div);
  });
}

async function marcar(id, valor){ await sb.from('citas').update({completada:valor}).eq('id', id); cargarCitas(); }
async function eliminar(id){ if(confirm('¿Eliminar esta cita?')){ await sb.from('citas').delete().eq('id', id); cargarCitas(); } }

function toggleHorario(){
  document.getElementById('horarioBody').classList.toggle('open');
  document.getElementById('horarioChevron').classList.toggle('open');
}

/* Refresca sola la lista si entra/cambia una cita mientras el panel está abierto */
sb.channel('citas-live').on('postgres_changes', {event:'*', schema:'public', table:'citas'}, ()=>{
  if(document.getElementById('dashboard').style.display!=='none') cargarCitas();
}).subscribe();
</script>
</body>
</html>
